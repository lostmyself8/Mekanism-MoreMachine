plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '8.4.0'
}

version = mod_version + (System.getenv('SNAPSHOT') ? '-SNAPSHOT' : '')
group = mod_group_id
base.archivesName = "${mod_id}-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()

sourceSets {
    main.resources.srcDir 'src/generated/resources'
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
sourceSets.main.resources.exclude '**/.cache/**'
configurations {
    runtimeClasspath.extendsFrom localRuntime
    smokeTestImplementation.extendsFrom implementation
    smokeTestCompileOnly.extendsFrom compileOnly
    smokeTestRuntimeOnly.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
}

def mekanismJarFile = file(providers.gradleProperty('mekanismJar').getOrElse('libs/Mekanism-26.2-10.8.0.homebaked-all.jar'))

var verifyMekanismDependency = tasks.register('verifyMekanismDependency') {
    group = 'verification'
    description = 'Check that the separately supplied Mekanism 26.2 snapshot exists.'
    inputs.property('mekanismJarPath', mekanismJarFile.absolutePath)
    doLast {
        if (!mekanismJarFile.isFile()) {
            throw new GradleException('Missing Mekanism 26.2 build dependency: ' + mekanismJarFile.absolutePath +
                    '. Supply the matching snapshot at libs/Mekanism-26.2-10.8.0.homebaked-all.jar, or use ' +
                    '-PmekanismJar=/path/to/the/snapshot.jar. GitHub Actions needs this dependency supplied explicitly; ' +
                    'it is not included in the repository. See docs/BUILDING-26.2.md.')
        }
    }
}

dependencies {
    // Local 26.2 snapshot, kept outside source control and never embedded in the release JAR.
    implementation files(mekanismJarFile)
    compileOnly 'maven.modrinth:distanthorizons:3.2.0-b-26.1.2'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    compileOnly 'mezz.jei:jei-26.2-common-api:30.32.0.221'
    compileOnly 'mezz.jei:jei-26.2-neoforge-api:30.32.0.221'
    localRuntime 'mezz.jei:jei-26.2-neoforge:30.32.0.221'
}

neoForge {
    version = neo_version
    mods {
        mekmm { sourceSet sourceSets.main }
        mekmm_smoketests { sourceSet sourceSets.smokeTest }
    }
    addModdingDependenciesTo(sourceSets.smokeTest)
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.smokeTest
            gameDirectory = layout.projectDirectory.dir('run-smoke')
            systemProperty 'mekmm.serverSmoke', 'true'
        }
        configureEach {
            loadedMods.set([mods.getByName('mekmm')])
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    runs.named('gameTestServer') { loadedMods.add(mods.getByName('mekmm_smoketests')) }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                      version: project.version, loader_version: '11', mod_description: mod_description,
                      mod_url: mod_url, mod_issue_tracker: mod_issue_tracker]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    dependsOn verifyMekanismDependency
    options.encoding = 'UTF-8'
}
tasks.named('jar') {
    from('LICENSE')
    exclude '**/.cache/**', '**/*.bbmodel', '**/*.blend', '**/*.psd'
}

spotless {
    encoding 'UTF-8'
    java {
        target 'src/main/java/**/*.java', 'src/smokeTest/java/**/*.java'
        importOrderFile(file('gradle/spotless/spotless.importorder'))
        endWithNewline()
        eclipse('4.36').configFile(file('gradle/spotless/spotless.eclipseformat.xml'))
    }
}

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
idea.module {
    downloadSources = true
    downloadJavadoc = true
}
tasks.register('printVersion') { doLast { println project.version } }
